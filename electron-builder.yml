appId: com.mindmaze.desktop
productName: MindMaze
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
# The mouse warrior, rendered from the same sprite the Android launcher icon uses
# (mindmaze commit 1d3258b) at full resolution rather than upscaled from the 192px mipmap.
icon: build/icon.png
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.games
  # Unsigned: family distribution does not justify a $99/yr Apple Developer ID. First launch
  # needs right-click -> Open (see README). Do not set an identity without also setting up
  # notarization, or Gatekeeper will reject the app outright rather than just warning.
  identity: null
win:
  target:
    - target: nsis
      arch: [x64]
  # Unsigned: family distribution does not justify a Windows code-signing certificate. First
  # launch shows a SmartScreen warning; "More info" -> "Run anyway" gets past it (see README).
linux:
  target: [AppImage]
  category: Game
  # Lets the desktop environment associate the running window with its launcher entry.
  synopsis: Trivia maze game
  desktop:
    entry:
      Name: MindMaze
