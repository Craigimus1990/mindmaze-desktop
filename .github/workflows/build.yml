name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check-assets
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: mindmaze-macos
            pattern: release/*.dmg
          - os: windows-latest
            script: dist:win
            artifact: mindmaze-windows
            pattern: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # One pattern per platform, not a shared list: macOS emits only .dmg and Windows only
          # .exe, so a combined list would ask each leg to match a glob its own build never
          # produces. Per-platform keeps `if-no-files-found: error` meaning "this build produced
          # no installer" rather than depending on how the action treats a partially-matching list.
          path: ${{ matrix.pattern }}
          # Fail loudly on an empty artifact. The default is `warn`, which would let a build that
          # produced no installer finish GREEN — and the release would then publish nothing for
          # that platform, with a passing tick suggesting it worked.
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            Download the installer for your machine.

            **macOS:** open the `.dmg`, drag MindMaze to Applications. The first launch
            needs a right-click on the app and then "Open" — the app is unsigned, so
            double-clicking shows a warning instead.

            **Windows:** run the `.exe`. Windows SmartScreen shows a warning once;
            choose "More info" and then "Run anyway".
